name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [flowkron-front-app-angular, flowkron-front-landing-angular]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  whatsapp-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowkron-baileys-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowkron-baileys-services/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: flowkron-auth-service
            requirements: requirements.txt
            checks: |
              python scripts/generate_jwt_keys.py
              export DJANGO_DEBUG=True JWT_PRIVATE_KEY_PATH=keys/jwt_private.pem JWT_PUBLIC_KEY_PATH=keys/jwt_public.pem
              python manage.py check
              python manage.py test
          - service: flowkron-operational-service
            requirements: requirements.txt
            checks: python -c 'from app.main import app; assert app.openapi()["paths"]'
          - service: flowkron-agent-core
            requirements: requirements-dev.txt
            checks: python -m pytest -q
          - service: smtp-http-blandskron
            requirements: requirements.txt
            checks: python -m pytest -q
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ${{ matrix.requirements }} pip-audit ruff
      - run: ruff check --select E9,F63,F7,F82 .
      - run: ${{ matrix.checks }}
      - run: pip-audit -r ${{ matrix.requirements }}

  contracts-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml jsonschema
      - working-directory: flowkron-api-contracts
        run: |
          python scripts/validate-json-schemas.py
          python scripts/validate-yaml-structure.py
          python scripts/validate-agent-docs.py
      - run: docker compose config --quiet

  compose-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose -f compose.demo.yaml -p flowkron-smoke up --build --wait --wait-timeout 180
      - run: python flowkron-deploy/bootstrap/smoke.py flowkron-smoke
      - if: failure()
        run: docker compose -f compose.demo.yaml -p flowkron-smoke ps --all
      - if: always()
        run: docker compose -f compose.demo.yaml -p flowkron-smoke down

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1 git --redact=100 --no-banner --log-opts='--all' /repo
