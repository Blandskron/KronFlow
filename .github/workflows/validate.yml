name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend/app, frontend/landing]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Review development advisories
        run: |
          report=$(mktemp)
          if npm audit --json > "$report"; then
            node ../../.github/scripts/check-dev-audit.mjs < "$report"
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
            node ../../.github/scripts/check-dev-audit.mjs < "$report"
          fi
      - name: Generate CycloneDX SBOM
        run: npm sbom --package-lock-only --sbom-format cyclonedx > sbom-cyclonedx.json
      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service == 'frontend/app' && 'frontend-app' || 'frontend-landing' }}
          path: ${{ matrix.service }}/sbom-cyclonedx.json
          retention-days: 30

  whatsapp-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/baileys-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/baileys-services/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --package-lock-only --sbom-format cyclonedx > sbom-cyclonedx.json
      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-whatsapp-lab
          path: backend/baileys-services/sbom-cyclonedx.json
          retention-days: 30

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend/auth-service
            requirements: requirements.txt
            checks: |
              python scripts/generate_jwt_keys.py
              export DJANGO_DEBUG=True JWT_PRIVATE_KEY_PATH=keys/jwt_private.pem JWT_PUBLIC_KEY_PATH=keys/jwt_public.pem
              python manage.py check
              python manage.py test
          - service: backend/operational-service
            requirements: requirements-dev.txt
            checks: |
              export FLOWKRON_TEST_POSTGRES_BIN="$(pg_config --bindir)"
              test -x "$FLOWKRON_TEST_POSTGRES_BIN/initdb"
              test -x "$FLOWKRON_TEST_POSTGRES_BIN/pg_ctl"
              "$FLOWKRON_TEST_POSTGRES_BIN/postgres" --version
              python -m unittest discover -s tests -v
              python -c 'from app.main import app; assert app.openapi()["paths"]'
          - service: backend/agent-core
            requirements: requirements-dev.txt
            checks: python -m pytest -q
          - service: backend/mail-service
            requirements: requirements.txt
            checks: python -m pytest -q
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ${{ matrix.requirements }} pip-audit ruff
      - run: ruff check --select E9,F63,F7,F82 .
      - run: ${{ matrix.checks }}
      - run: pip-audit -r ${{ matrix.requirements }}

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose -f compose.demo.yaml --env-file .env.example config --quiet

  compose-startup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: demo
            compose: compose.demo.yaml
            smoke_args: ''
          - mode: standard
            compose: compose.yaml
            smoke_args: --standard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose -f ${{ matrix.compose }} -p kronflow-smoke up --build --wait --wait-timeout 180
      - run: python deploy/bootstrap/smoke.py kronflow-smoke ${{ matrix.smoke_args }}
      - if: failure()
        run: docker compose -f ${{ matrix.compose }} -p kronflow-smoke ps --all
      - if: always()
        run: docker compose -f ${{ matrix.compose }} -p kronflow-smoke down

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1 git --redact=100 --no-banner --log-opts='--all' /repo

  privacy-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Operational privacy & compliance gates (PII parity, scrubber, CSP/HSTS, crypto, ARCOP, hash-chain, SLAs)
        working-directory: backend/operational-service
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest \
            tests.test_pii_inventory_parity \
            tests.test_pii_scrubber \
            tests.test_cycle2_security_foundations \
            tests.test_cycle3_consent_and_transparency \
            tests.test_cycle4_arcop_and_explainability \
            tests.test_cycle5_lifecycle \
            tests.test_cycle6_subprocessors_and_sensitive \
            tests.test_cycle7_governance_and_incidents \
            tests.test_cycle8_compliance_as_code \
            tests.test_cycle9_release_readiness \
            -v
      - name: IAM PII inventory parity & privacy audit gate
        working-directory: backend/auth-service
        run: |
          python -m pip install -r requirements.txt
          python scripts/generate_jwt_keys.py
          export DJANGO_DEBUG=True JWT_PRIVATE_KEY_PATH=keys/jwt_private.pem JWT_PUBLIC_KEY_PATH=keys/jwt_public.pem
          python manage.py test apps.audit.tests
      - name: Agent Core PII scrubber, egress & JWT revocation gate
        working-directory: backend/agent-core
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest app/tests/test_privacy_ai_egress.py app/tests/test_jwt_revocation.py -q
