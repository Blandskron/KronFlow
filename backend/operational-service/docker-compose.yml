name: kronflow-operational-local

services:
  operational-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.local}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-operational}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in .env.local}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8080}
    ports:
      - "${OPERATIONAL_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
