      iam_tenant:
        owner_role: controller
        contains_pii: true
        retention_policy: "tenant_lifetime"
        pii_columns:
          tax_id:
            category: financial
            sensitivity: medium
            legal_basis: contract
            retention: tenant_lifetime
            export_action: include
            erase_action: anonymize
          dpo_contact_email:
            category: governance_contact
            sensitivity: low
            legal_basis: legal_obligation
            retention: tenant_lifetime
            export_action: include
            erase_action: anonymize
        non_pii_columns:
