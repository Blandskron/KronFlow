      iam_tenant_membership:
        owner_role: controller
        contains_pii: false
        retention_policy: "tenant_lifetime"
        pii_columns: {}
        non_pii_columns:
          [id, user_id, tenant_id, status, invited_by_id, joined_at, revoked_at, created_at, updated_at]

      iam_tenant_invitation:
