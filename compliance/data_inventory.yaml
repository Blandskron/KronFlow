version: "1.0"
schema_version: "tenant_schema_v22"
standards:
  - "GDPR Art. 30"
  - "Ley 21.719 (Chile) Art. 14 quater"
  - "ISO/IEC 27701:2025"

allowed_values:
  owner_roles: [controller, processor]
  categories:
    - identifier
    - national_id
    - contact
    - credential
    - communication
    - financial
    - behavioral
    - device_network
    - voice_biometric
    - attachment
    - consent_evidence
    - governance_contact
  sensitivities: [low, medium, high, special]
  legal_bases: [consent, contract, legal_obligation, legitimate_interest]
  export_actions: [include, exclude_security, exclude_internal, summary_only]
  erase_actions: [anonymize, redact, delete, retain_proof, unlink_and_delete]

services:
  auth-service:
    tables:
      auth_user:
        owner_role: controller
        contains_pii: true
        retention_policy: "account_lifetime"
        pii_columns:
          username:
            category: identifier
            sensitivity: medium
            legal_basis: contract
            retention: account_lifetime
            export_action: include
            erase_action: anonymize
          email:
            category: contact
            sensitivity: medium
            legal_basis: contract
            retention: account_lifetime
            export_action: include
            erase_action: anonymize
          first_name:
            category: identifier
            sensitivity: medium
            legal_basis: contract
            retention: account_lifetime
            export_action: include
            erase_action: anonymize
          last_name:
            category: identifier
            sensitivity: medium
            legal_basis: contract
            retention: account_lifetime
            export_action: include
            erase_action: anonymize
          password:
            category: credential
            sensitivity: high
            legal_basis: contract
            retention: account_lifetime
            export_action: exclude_security
            erase_action: anonymize
        non_pii_columns: [id, last_login, is_superuser, is_staff, is_active, date_joined]

      iam_user_profile:
        owner_role: controller
        contains_pii: true
        retention_policy: "account_lifetime"
        pii_columns:
          display_name:
            category: identifier
            sensitivity: medium
            legal_basis: contract
            retention: account_lifetime
            export_action: include
            erase_action: anonymize
          phone:
            category: contact
            sensitivity: medium
            legal_basis: contract
            retention: account_lifetime
            export_action: include
            erase_action: anonymize
          avatar_url:
            category: identifier
            sensitivity: low
            legal_basis: contract
            retention: account_lifetime
            export_action: include
            erase_action: anonymize
          google_subject:
            category: identifier
            sensitivity: high
            legal_basis: contract
            retention: account_lifetime
            export_action: exclude_security
            erase_action: anonymize
        non_pii_columns:
          [id, user_id, timezone, locale, email_verified_at, account_activated_at,
           initial_password_set_at, onboarding_completed_at, mfa_enabled, mfa_confirmed_at,
           created_at, updated_at]

      iam_contact_message:
        owner_role: controller
        contains_pii: true
        retention_policy: "180d"
        pii_columns:
          name:
            category: identifier
            sensitivity: medium
            legal_basis: consent
            retention: 180d
            export_action: include
            erase_action: delete
          email:
            category: contact
            sensitivity: medium
            legal_basis: consent
            retention: 180d
            export_action: include
            erase_action: delete
          company:
            category: identifier
            sensitivity: low
            legal_basis: consent
            retention: 180d
            export_action: include
            erase_action: delete
          phone:
            category: contact
            sensitivity: medium
            legal_basis: consent
            retention: 180d
            export_action: include
            erase_action: delete
          message:
            category: communication
            sensitivity: medium
            legal_basis: consent
            retention: 180d
            export_action: include
            erase_action: delete
          ip_address:
            category: device_network
            sensitivity: medium
            legal_basis: legitimate_interest
            retention: 180d
            export_action: exclude_security
            erase_action: delete
          user_agent:
            category: device_network
            sensitivity: low
            legal_basis: legitimate_interest
            retention: 180d
            export_action: exclude_security
            erase_action: delete
        non_pii_columns: [id, accept_terms, privacy_notice_version, status, created_at]

      iam_audit_log:
        owner_role: controller
        contains_pii: true
        retention_policy: "365d"
        pii_columns:
          ip_address:
            category: device_network
            sensitivity: medium
            legal_basis: legitimate_interest
            retention: 365d
            export_action: exclude_security
            erase_action: anonymize
          user_agent:
            category: device_network
            sensitivity: low
            legal_basis: legitimate_interest
            retention: 365d
            export_action: exclude_security
            erase_action: anonymize
          metadata:
            category: behavioral
            sensitivity: medium
            legal_basis: legitimate_interest
            retention: 365d
            export_action: summary_only
            erase_action: redact
        non_pii_columns: [id, user_id, tenant_id, event, correlation_id, created_at]

      iam_user_session:
        owner_role: controller
        contains_pii: true
        retention_policy: "session_ttl_plus_30d"
        pii_columns:
          ip_address:
            category: device_network
            sensitivity: medium
            legal_basis: contract
            retention: session_ttl_plus_30d
            export_action: include
            erase_action: delete
          user_agent:
            category: device_network
            sensitivity: low
            legal_basis: contract
            retention: session_ttl_plus_30d
