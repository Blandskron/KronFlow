services:
  mail-service:
    build:
      context: ../../backend/mail-service
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_SENDERS_JSON: ${EMAIL_SENDERS_JSON:-}
      INTERNAL_CLIENTS_JSON: ${INTERNAL_CLIENTS_JSON:-}
      REDIS_URL: redis://redis:6379/1
      ENABLE_LEGACY_MAIL_ENDPOINT: "false"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      kronflow-network:
        aliases:
          - flowkron-mail-service
