services:
  agent-core:
    build: .
    env_file:
      - path: .env.local
        required: false
    environment:
      PERSISTENCE_MODE: operational
      ALLOW_LOCAL_DB_BOOTSTRAP: "false"
      OPERATIONAL_SERVICE_URL: ${OPERATIONAL_SERVICE_URL:-http://flowkron-operational-service:8001}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-local-internal-token}
      JWT_PUBLIC_KEY_PATH: ${AGENT_CORE_JWT_PUBLIC_KEY_PATH:-/keys/jwt_public.pem}
      ALLOW_INSECURE_TENANT_HEADER: ${AGENT_CORE_ALLOW_INSECURE_TENANT_HEADER:-false}
      AZURE_OPENAI_ENABLED: ${AZURE_OPENAI_ENABLED:-false}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-02-01}
      CHAT_COMPLETION_URL: ${CHAT_COMPLETION_URL:-}
      CHAT_COMPLETION_MODEL_NAME: ${CHAT_COMPLETION_MODEL_NAME:-gpt-4o-mini}
      CHAT_COMPLETION_MAX_TOKENS: ${CHAT_COMPLETION_MAX_TOKENS:-2000}
      CHAT_COMPLETION_TEMPERATURE: ${CHAT_COMPLETION_TEMPERATURE:-0.3}
      CHAT_COMPLETION_TIMEOUT_SECONDS: ${CHAT_COMPLETION_TIMEOUT_SECONDS:-60}
      EMBEDDING_URL: ${EMBEDDING_URL:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-text-embedding-3-small}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-60}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    ports:
      - "8002:8002"
    volumes:
      - ../flowkron-deploy/data/jwt-keys:/keys:ro
