openapi: 3.1.0
info:
  title: Flowkron Agent Core API
  version: 0.3.1
  description: |
    Contrato del nucleo conversacional omnicanal y gestion de contexto empresarial.
    En modo integrado, documentos/status/retrieval se delegan a flowkron-operational-service;
    rutas stateful locales pueden responder 501 cuando la persistencia esta delegada.
servers:
  - url: http://localhost:8002
security:
  - BearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness
      responses:
        "200":
          description: Servicio activo
  /ready:
    get:
      tags: [Health]
      summary: Readiness
      responses:
        "200":
          description: Servicio listo
  /api/v1/agent/messages:
    post:
      tags: [Agent Runtime]
      summary: Procesa un mensaje omnicanal normalizado
      description: El tenant autenticado debe coincidir con tenant_id si el body lo incluye.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/ai/agent-message-request.schema.json
      responses:
        "200":
          description: Respuesta conversacional estructurada
          content:
            application/json:
              schema:
                $ref: ../../schemas/ai/agent-message-response.schema.json
        "401":
          description: Falta autenticacion
        "403":
          description: Tenant del payload no coincide con el tenant autenticado
  /api/v1/agent/simulate:
    post:
      tags: [Agent Runtime]
      summary: Simula un mensaje con el mismo contrato del endpoint universal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/ai/agent-message-request.schema.json
      responses:
        "200":
          description: Resultado simulado
          content:
            application/json:
              schema:
                $ref: ../../schemas/ai/agent-message-response.schema.json

  # --- CONTEXT MANAGEMENT ENDPOINTS ---
  /api/v1/context/status:
    get:
      tags: [Business Context]
      summary: Obtiene el estado real del contexto empresarial del tenant
      responses:
        "200":
          description: Estado agregado de contexto empresarial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessContextStatusRead'

  /api/v1/context/documents/upload:
    post:
      tags: [Business Context]
      summary: Sube un nuevo documento de contexto desde texto JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      responses:
        "201":
          description: Documento subido y procesado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRead'

  /api/v1/context/documents/upload-file:
    post:
      tags: [Business Context]
      summary: Sube un documento de contexto como archivo y extrae texto para RAG
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, file]
              properties:
                title:
                  type: string
                status:
                  type: string
                  default: active
                priority:
                  type: integer
                  default: 100
                file:
                  type: string
                  format: binary
                  description: Archivo .txt, .md, .csv, .docx o .pdf con texto extraible
      responses:
        "201":
          description: Documento subido, texto extraido y contexto indexado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRead'
        "400":
          description: Extension no soportada
        "413":
          description: Archivo excede el tamano maximo permitido
        "422":
          description: No se pudo extraer texto util del archivo

  /api/v1/context/documents:
    get:
      tags: [Business Context]
      summary: Lista todos los documentos cargados para el tenant
      responses:
        "200":
          description: Listado de documentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentRead'

  /api/v1/context/documents/{document_id}:
    get:
      tags: [Business Context]
      summary: Obtiene un documento de contexto específico
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detalle del documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRead'
        "404":
          description: Documento no encontrado
    patch:
      tags: [Business Context]
      summary: Actualiza parcialmente los metadatos de un documento (modo local)
      description: En modo integrado responde 501 porque la persistencia de documentos esta delegada a Operational.
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPatch'
      responses:
        "200":
          description: Documento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRead'
        "501":
          description: Persistencia delegada a Operational
    delete:
      tags: [Business Context]
      summary: Elimina un documento y sus chunks (modo local)
      description: En modo integrado responde 501 porque la persistencia de documentos esta delegada a Operational.
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Documento eliminado
        "501":
          description: Persistencia delegada a Operational

  /api/v1/context/templates:
    get:
      tags: [Business Context]
      summary: Lista las plantillas base de onboarding disponibles
      responses:
        "200":
          description: Listado de plantillas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateRead'

  /api/v1/context/templates/{template_id}/download:
    get:
      tags: [Business Context]
      summary: Descarga una plantilla base en formato Word o PDF
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Archivo de plantilla
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary

  /api/v1/context/templates/{template_id}:
    get:
      tags: [Business Context]
      summary: Obtiene metadata de una plantilla base
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Metadata de plantilla
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRead'
        "404":
          description: Plantilla no encontrada

  /api/v1/context/forms:
    get:
      tags: [Business Context]
      summary: Obtiene los formularios de contexto fundacionales del tenant (modo local)
      description: En modo integrado responde 501 porque el flujo productivo usa documentos/plantillas delegados a Operational.
      responses:
        "200":
          description: Formularios disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormRead'
        "501":
          description: Persistencia delegada a Operational

  /api/v1/context/forms/submissions:
    get:
      tags: [Business Context]
      summary: Lista todas las respuestas a formularios enviadas por el tenant (modo local)
      description: En modo integrado responde 501 porque la persistencia esta delegada a Operational.
      responses:
        "200":
          description: Respuestas cargadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormSubmissionRead'
        "501":
          description: Persistencia delegada a Operational

  /api/v1/context/forms/{form_id}:
    get:
      tags: [Business Context]
      summary: Obtiene un formulario de contexto por ID (modo local)
      description: En modo integrado responde 501 porque la persistencia esta delegada a Operational.
      parameters:
        - name: form_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Formulario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormRead'
        "404":
          description: Formulario no encontrado
        "501":
          description: Persistencia delegada a Operational

  /api/v1/context/forms/{form_id}/submit:
    post:
      tags: [Business Context]
      summary: Guarda las respuestas a un formulario especifico (modo local)
      description: En modo integrado responde 501 porque la persistencia esta delegada a Operational.
      parameters:
        - name: form_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormSubmissionCreate'
      responses:
        "201":
          description: Formulario guardado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSubmissionRead'
        "501":
          description: Persistencia delegada a Operational

  # --- ONBOARDING ASSISTANT ENDPOINTS ---
  /api/v1/setup-chat/sessions:
    post:
      tags: [Setup Assistant]
      summary: Crea una sesión con el asistente conversacional de configuración
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupSessionCreate'
      responses:
        "200":
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupSessionRead'

  /api/v1/setup-chat/sessions/{session_id}/messages:
    post:
      tags: [Setup Assistant]
      summary: Envía una respuesta al asistente de configuración
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupMessageCreate'
      responses:
        "200":
          description: Respuesta procesada y siguiente pregunta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupSessionRead'

  /api/v1/setup-chat/sessions/{session_id}/generate-context:
    post:
      tags: [Setup Assistant]
      summary: Consolida las respuestas del chat e inserta el contexto generado
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contexto consolidado generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedContextRead'

  # --- AGENT RULES ENDPOINTS ---
  /api/v1/agent/rules:
    get:
      tags: [Agent Rules]
      summary: Obtiene reglas conversacionales (modo local)
      description: En modo integrado puede responder 501 hasta que exista adapter operacional de reglas.
      responses:
        "200":
          description: Reglas listadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleRead'
        "501":
          description: Persistencia delegada a Operational
    post:
      tags: [Agent Rules]
      summary: Registra una nueva regla de atencion conversacional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreate'
      responses:
        "201":
          description: Regla creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRead'
        "501":
          description: Persistencia delegada a Operational

  /api/v1/agent/rules/{rule_id}:
    patch:
      tags: [Agent Rules]
      summary: Modifica una regla de atencion conversacional (modo local)
      description: En modo integrado puede responder 501 hasta que exista adapter operacional de reglas.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePatch'
      responses:
        "200":
          description: Regla actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRead'
        "501":
          description: Persistencia delegada a Operational
    delete:
      tags: [Agent Rules]
      summary: Elimina una regla de atencion conversacional (modo local)
      description: En modo integrado puede responder 501 hasta que exista adapter operacional de reglas.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Regla eliminada
        "501":
          description: Persistencia delegada a Operational

  # --- CONVERSATIONS & TRACES ENDPOINTS ---
  /api/v1/agent/conversations/{conversation_id}:
    get:
      tags: [Agent Runtime]
      summary: Obtiene detalles de estado de una sesion de conversacion (modo local/stateful)
      description: En modo integrado puede responder 501 porque la persistencia stateful esta delegada.
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle de conversación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRead'
        "404":
          description: Conversación no encontrada
        "501":
          description: Persistencia delegada a Operational

  /api/v1/agent/conversations/{conversation_id}/messages:
    get:
      tags: [Agent Runtime]
      summary: Obtiene mensajes historicos de una conversacion (modo local/stateful)
      description: En modo integrado puede responder 501 porque la persistencia stateful esta delegada.
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de mensajes ordenados cronológicamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationMessageRead'
        "501":
          description: Persistencia delegada a Operational

  /api/v1/agent/conversations/{conversation_id}/traces:
    get:
      tags: [Traces]
      summary: Obtiene trazas RAG de una sesion (modo local/stateful)
      description: En modo integrado puede responder 501 porque la persistencia stateful esta delegada.
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Listado de trazas de recuperación RAG
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RetrievalTraceRead'
        "501":
          description: Persistencia delegada a Operational

  /api/v1/agent/traces/{trace_id}:
    get:
      tags: [Traces]
      summary: Obtiene detalles y fuentes de una traza RAG especifica (modo local/stateful)
      description: En modo integrado puede responder 501 porque la persistencia stateful esta delegada.
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detalle de traza
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  conversation_id:
                    type: string
                  confidence:
                    type: number
                  sources:
                    type: array
                    items:
                      type: object
        "501":
          description: Persistencia delegada a Operational

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DocumentCreate:
      type: object
      required: [title, filename, content]
      properties:
        title:
          type: string
        filename:
          type: string
        content:
          type: string
        content_type:
          type: string
          default: text/plain
        status:
          type: string
          enum: [active, draft, deprecated]
          default: active
        priority:
          type: integer
          default: 100

    DocumentPatch:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
          enum: [active, draft, deprecated]
        priority:
          type: integer

    DocumentRead:
      type: object
      required: [id, tenant_id, title, filename, status, priority, version]
      properties:
        id:
          type: integer
        tenant_id:
          type: string
        title:
          type: string
        filename:
          type: string
        content_type:
          type: string
          nullable: true
        status:
          type: string
        priority:
          type: integer
        version:
          type: integer
        source_type:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true

    BusinessContextStatusRead:
      type: object
      required: [progress_percent, agent_status, last_updated_at, active_documents_count, documents, document_actions]
      properties:
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        agent_status:
          type: string
          enum: [not_configured, pending, processing, trained, active, error]
        last_updated_at:
          type: string
          nullable: true
        active_documents_count:
          type: integer
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRead'
        document_actions:
          type: object
          additionalProperties:
            type: boolean

    TemplateRead:
      type: object
      required: [id, code, name, description, fields, download_options]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            type: object
        download_options:
          type: array
          items:
            type: object
            required: [format, template_id, filename, media_type]
            properties:
              format:
                type: string
                enum: [pdf, docx]
              template_id:
                type: integer
              filename:
                type: string
              media_type:
                type: string

    FormRead:
      type: object
      required: [id, code, name, description, fields]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              label:
                type: string
              field_type:
                type: string
              required:
                type: boolean
              position:
                type: integer

    FormSubmissionCreate:
      type: object
      required: [payload]
      properties:
        payload:
          type: object
          description: Pares clave-valor correspondientes a los campos del formulario.

    FormSubmissionRead:
      type: object
      required: [id, tenant_id, form_id, payload, created_at]
      properties:
        id:
          type: integer
        tenant_id:
          type: string
        form_id:
          type: integer
        payload:
          type: object
        created_at:
          type: string

    SetupSessionCreate:
      type: object
      properties:
        objective:
          type: string
          default: build_business_context

    SetupSessionRead:
      type: object
      required: [session_id, next_question]
      properties:
        session_id:
          type: string
        next_question:
          type: string

    SetupMessageCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string

    GeneratedContextRead:
      type: object
      required: [summary, status]
      properties:
        summary:
          type: string
        status:
          type: string
          default: draft

    RuleCreate:
      type: object
      required: [name, content]
      properties:
        name:
          type: string
        rule_type:
          type: string
          default: general
        content:
          type: string
        priority:
          type: integer
          default: 100
        is_active:
          type: boolean
          default: true

    RulePatch:
      type: object
      properties:
        name:
          type: string
        content:
          type: string
        priority:
          type: integer
        is_active:
          type: boolean

    RuleRead:
      type: object
      required: [id, tenant_id, name, rule_type, content, priority, is_active]
      properties:
        id:
          type: integer
        tenant_id:
          type: string
        name:
          type: string
        rule_type:
          type: string
        content:
          type: string
        priority:
          type: integer
        is_active:
          type: boolean

    ConversationRead:
      type: object
      required: [id, conversation_id, channel, requires_human, status]
      properties:
        id:
          type: integer
        conversation_id:
          type: string
        channel:
          type: string
        requires_human:
          type: boolean
        status:
          type: string

    ConversationMessageRead:
      type: object
      required: [sender_type, message_type, content, attachments]
      properties:
        sender_type:
          type: string
          enum: [customer, agent, human]
        message_type:
          type: string
          enum: [text, audio, image, file]
        content:
          type: string
        attachments:
          type: array
          items:
            type: object

    RetrievalTraceRead:
      type: object
      required: [id, query, confidence, sources]
      properties:
        id:
          type: integer
        query:
          type: string
        confidence:
          type: number
        sources:
          type: array
          items:
            type: object
