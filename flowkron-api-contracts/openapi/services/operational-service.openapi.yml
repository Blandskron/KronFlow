          enum: [cold, warm, hot]
          nullable: true
        lifecycle_status:
          type: string
          maxLength: 32
          nullable: true
        score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        metadata:
          type: object
          default: {}

