      description: |
        Calcula progreso sobre cinco documentos activos recomendados. En el modo
        integrado actual `document_actions` devuelve `delete`, `patch`, `replace`
        y `retry_processing` en `false` porque Operational es el duenio de la
        persistencia y Agent Core no debe modificar documentos directamente.
      operationId: internal_context_status
      tags: [Internal Context]
      security:
        - InternalToken: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: integer
