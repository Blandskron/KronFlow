components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT RS256 emitido por flowkron-auth-service. Debe incluir claim `tenant_id`,
        runtime activo y plan distinto de Free para acceder a los endpoints del dashboard.
    BaileysBridge:
      type: apiKey
      in: header
      name: X-Baileys-Token
      description: Credencial privada del conector; requiere X-Flowkron-Tenant y runtime activo. No es JWT ni se expone al navegador.
    IngestAuth:
      type: apiKey
      in: header
      name: X-Ingest-Key
      description: |
        Requiere headers `X-Tenant-Code` y `X-Ingest-Key`. El runtime debe estar activo
        y el plan debe ser pagado.
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Token compartido entre servicios internos (INTERNAL_TOKEN env var).

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:

    TurnTokenIn:
      properties:
        claim_token:
          maxLength: 64
          minLength: 20
          title: Claim Token
          type: string
      required:
      - claim_token
      title: TurnTokenIn
      type: object
    TurnSendIn:
      allOf:
        - $ref: '#/components/schemas/TurnTokenIn'
        - type: object
          properties:
            provider_message_id:
              type: [string, 'null']
              minLength: 1
              maxLength: 220
    ProviderReceiptIn:
      type: object
      required: [account_key, provider_message_id, recipient_jids, status]
      properties:
        account_key:
          $ref: '#/components/schemas/TurnAccountKey'
        connection_id: {type: string, const: default}
        provider_message_id: {type: string, minLength: 1, maxLength: 220}
        recipient_jids:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
            maxLength: 180
            pattern: '^[0-9]+@(s\.whatsapp\.net|lid)$'
        status:
          type: string
          enum: [sent, failed, delivered, read]
        failure_reason:
          type: [string, 'null']
          enum: [provider_rejected, account_restricted, connection_invalid, null]
    TurnPrepareIn:
      properties:
        claim_token:
          maxLength: 64
          minLength: 20
          title: Claim Token
          type: string
        reply_body:
          maxLength: 4000
          minLength: 1
          pattern: \S
          title: Reply Body
          type: string
        requires_human:
          default: false
          title: Requires Human
          type: boolean
      required:
      - claim_token
      - reply_body
      title: TurnPrepareIn
      type: object
    TurnReceiptIn:
      properties:
        provider_message_id:
          maxLength: 220
          minLength: 1
          title: Provider Message Id
          type: string
        sent_at:
          format: date-time
          title: Sent At
          type: string
      required:
      - provider_message_id
      - sent_at
      title: TurnReceiptIn
      type: object
    TurnCompleteIn:
      properties:
        provider_message_id:
          maxLength: 220
          minLength: 1
          title: Provider Message Id
          type: string
        sent_at:
          format: date-time
          title: Sent At
          type: string
        claim_token:
          maxLength: 64
          minLength: 20
          title: Claim Token
          type: string
      required:
      - provider_message_id
      - sent_at
      - claim_token
      title: TurnCompleteIn
      type: object
    TurnOut:
      properties:
        turn_id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Turn Id
        state:
          enum:
          - received
          - generating
          - prepared
          - sending
          - completed
          - unknown
          - cancelled
          - legacy_untracked
          title: State
          type: string
        claimed:
          default: false
          title: Claimed
          type: boolean
        claim_token:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Claim Token
        lease_until:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Lease Until
        input_body:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Input Body
        phone:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Phone
        external_thread_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: External Thread Id
        reply_body:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Reply Body
        requires_human:
          default: false
          title: Requires Human
          type: boolean
        outbound_message_id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Outbound Message Id
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Error
      required:
      - state
      title: TurnOut
      type: object
    TurnClaimIn:
      allOf:
      - $ref: '#/components/schemas/WhatsAppMessageIn'
      - type: object
        properties:
          direction:
            type: string
            enum:
            - inbound
            default: inbound
    TurnAccountKey:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 del identificador de la cuenta sin el sufijo de dispositivo.

    TurnAccountIn:
      type: object
      required: [account_key]
      properties:
        account_key:
          $ref: '#/components/schemas/TurnAccountKey'

    TurnEnqueueIn:
      allOf:
        - $ref: '#/components/schemas/TurnClaimIn'
        - type: object
          required: [account_key, recipient_jid, body]
          properties:
            account_key:
              $ref: '#/components/schemas/TurnAccountKey'
            recipient_jid:
              type: string
              maxLength: 180
              pattern: '^[0-9]+@(s\.whatsapp\.net|lid)$'
            body:
              type: string
              minLength: 1
              maxLength: 4000

    TurnEnqueueResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [disposition]
          properties:
            turn_id:
              type: integer
              nullable: true
            disposition:
              type: string
              enum: [accepted, duplicate, legacy_untracked]
        meta:
          type: object
        status:
          type: object

    TurnNextResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            job:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/TurnOut'
                - type: object
                  required: [recipient_jid]
                  properties:
                    recipient_jid:
                      type: string
        meta:
          type: object
        status:
          type: object

    TurnResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TurnOut'
        meta:
          type: object
        status:
          type: object

    # ── Health ─────────────────────────────────────────────────────────────────

    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: ok

    # ── Error ──────────────────────────────────────────────────────────────────

    ApiError:
      type: object
      required: [type, title, status, detail, instance, error_code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        error_code:
          type: string
        errors:
          type: array
          items:
            type: object

    # ── Ingest ─────────────────────────────────────────────────────────────────

    WhatsAppMessageIn:
      type: object
      required: [external_message_id, phone, sent_at]
      properties:
        external_message_id:
          type: string
          minLength: 1
          maxLength: 220
          description: Identidad idempotente del mensaje dentro de la empresa autenticada, conexión y canal. Repetirla no actualiza el mensaje original.
        connection_id:
          type: string
          enum: [default]
          default: default
          description: Conexión única actual por empresa. Otros valores se rechazan hasta habilitar varias conexiones.
        provider_message_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 220
          description: ID real del proveedor para este mensaje; no heredar el ID entrante al guardar su respuesta.
        message_type:
          type: string
          enum: [text]
          default: text
        delivery_status:
          type: string
          nullable: true
          enum: [unknown, received, sent, failed]
          description: Estado reportado por el adaptador, sin verificar recibos. Omitido o null deriva received para inbound y unknown para outbound. sent indica aceptación del envío, no entrega ni lectura.
        external_thread_id:
          type: string
          maxLength: 180
          nullable: true
        phone:
          type: string
          minLength: 4
          maxLength: 48
        full_name:
          type: string
          default: ''
        email:
          type: string
          default: ''
        direction:
          type: string
          enum: [inbound, outbound]
          default: inbound
        body:
          type: string
          default: ''
        channel:
          type: string
          enum: [whatsapp]
          default: whatsapp
        sent_at:
          type: string
          format: date-time
        raw_payload:
