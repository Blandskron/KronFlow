openapi: 3.1.0
info:
  title: Flowkron Operational Service API
  version: 0.5.0
  description: |
    Servicio operacional multi-tenant de la plataforma Flowkron.
    Gestiona ingesta de mensajes WhatsApp desde un adaptador de WhatsApp, leads, conversaciones,
    analíticas, contexto de agente y aprovisionamiento de schemas por tenant.
    Los endpoints de usuario requieren un JWT de acceso. Las lecturas CRM requieren users.read;
    la edición de leads requiere crm.manage, los agentes requieren agents.create y las lecturas
    de auditoría requieren audit.read. La ingesta aplica límites antes de verificar credenciales.
  contact:
    name: Flowkron Engineering
servers:
  - url: http://localhost:8001
    description: Local development
  - url: http://localhost:8001
    description: Production

tags:
  - name: Health
    description: Healthcheck del servicio
  - name: Ingest
    description: Ingesta de eventos desde un adaptador de WhatsApp (auth por X-Tenant-Code + X-Ingest-Key)
  - name: Leads
    description: CRUD de leads del tenant (auth JWT Bearer)
  - name: Conversations
    description: Lecttura de conversaciones y mensajes del tenant (auth JWT Bearer)
  - name: Analytics
    description: Resumen analítico del tenant (auth JWT Bearer)
  - name: Agents
    description: Gestión del agente del tenant (STUB — parcialmente implementado)
  - name: Operational Data
    description: Acceso directo a tablas operacionales del tenant (auth JWT Bearer)
  - name: Internal Tenants
    description: Aprovisionamiento y gestión interna de tenants (auth X-Internal-Token)
  - name: Internal Context
    description: Acceso al contexto empresarial por tenant para Agent Core (auth X-Internal-Token)
  - name: Internal Migrations
    description: Ejecución de migraciones de schema (auth X-Internal-Token)

paths:

  # ─── Health ─────────────────────────────────────────────────────────────────

  /healthz:
    get:
      summary: Liveness check
      operationId: health_liveness
      tags: [Health]
      security: []
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /readyz:
    get:
      summary: Readiness check (verifica conexión a DB)
      operationId: health_readiness
      tags: [Health]
      security: []
      responses:
        '200':
          description: Servicio listo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: DB no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ─── Ingest — WhatsApp ───────────────────────────────────────────────────────

  /api/v1/ingest/whatsapp/message:
    post:
      summary: Ingestar un mensaje entrante de WhatsApp
      description: |
        Crea o actualiza cliente, lead y conversación para mensajes nuevos. Registra el mensaje
        de forma idempotente usando empresa autenticada, conexión, canal y `external_message_id`.
        Una repetición no modifica contacto ni conversación. Requiere runtime activo.
      operationId: ingest_whatsapp_message
      tags: [Ingest]
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppMessageIn'
      responses:
        '200':
          description: Mensaje procesado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '409':
          description: Identidad externa ya utilizada para otro hilo o dirección
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Payload inválido; solo conexión default y tipo text habilitados
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/ingest/whatsapp/lead-classification:
    post:
      summary: Actualizar clasificación de un lead por teléfono
      operationId: ingest_whatsapp_lead_classification
      tags: [Ingest]
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadClassificationIn'
      responses:
        '200':
          description: Clasificación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ingest/whatsapp/handoff:
    post:
      summary: Marcar conversación como requiere atención humana
      operationId: ingest_whatsapp_handoff
      tags: [Ingest]
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffIn'
      responses:
        '200':
          description: Handoff registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ingest/whatsapp/status:
    post:
      summary: Actualizar estado de una conversación por thread externo
      operationId: ingest_whatsapp_status
      tags: [Ingest]
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppStatusIn'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'

  /api/v1/ingest/whatsapp/inventory:
    get:
      summary: Obtener inventario disponible del tenant
      operationId: ingest_whatsapp_inventory
      tags: [Ingest]
      security:
        - IngestAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Inventario
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object

  /api/v1/ingest/whatsapp/customer:
    get:
      summary: Obtener cliente por teléfono
      operationId: ingest_whatsapp_customer_get
      tags: [Ingest]
      security:
        - IngestAuth: []
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 48
      responses:
        '200':
          description: Datos del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ingest/whatsapp/consent:
    get:
      summary: Obtener estado de consentimiento por teléfono
      operationId: ingest_whatsapp_consent_get
      tags: [Ingest]
      security:
        - IngestAuth: []
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 48
      responses:
        '200':
          description: Estado de consentimiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentOut'
    post:
      summary: Registrar consentimiento de datos de un cliente
      description: Con external_message_id se deduplica el comando por contacto. El puente puede incluir sent_at para ordenar
        por fecha del proveedor. BAJA prevalece sobre ACEPTO si coinciden en el mismo segundo.
      operationId: ingest_whatsapp_consent_post
      tags: [Ingest]
      security:
        - IngestAuth: []
        - BaileysBridge: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentIn'
      responses:
        '200':
          description: Consentimiento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentUpdateResponse'

  /api/v1/ingest/whatsapp/client:
    post:
      summary: Upsert de cliente desde un adaptador de WhatsApp
      operationId: ingest_whatsapp_client_upsert
      tags: [Ingest]
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpsertIn'
      responses:
        '200':
          description: Cliente upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientUpsertResponse'

  /api/v1/ingest/whatsapp/lead:
    post:
      summary: Upsert de lead enriquecido desde un adaptador de WhatsApp
      operationId: ingest_whatsapp_lead_upsert
      tags: [Ingest]
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadUpsertIn'
      responses:
        '200':
          description: Lead upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadUpsertResponse'

  /api/v1/ingest/whatsapp/privacy-requests:
    post:
      summary: Registrar solicitud de derecho de datos (privacidad)
      operationId: ingest_whatsapp_privacy_request
      tags: [Ingest]
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyRequestIn'
      responses:
        '201':
          description: Solicitud registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequestResponse'

  /api/v1/ingest/whatsapp/dashboard-messages:
    post:
      summary: Registrar mensajes de usuario y agente para el dashboard
      operationId: ingest_whatsapp_dashboard_messages
      tags: [Ingest]
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardMessagesIn'
      responses:
        '200':
          description: Mensajes registrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMessagesResponse'

  /api/v1/ingest/whatsapp/executives/assign:
    post:
      summary: Asignar ejecutivo round-robin a un lead
      operationId: ingest_whatsapp_executives_assign
      tags: [Ingest]
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutiveAssignIn'
      responses:
        '200':
          description: Ejecutivo asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutiveOut'

  /api/v1/ingest/whatsapp/executives/link:
    post:
      summary: Vincular un lead a un ejecutivo ya seleccionado
      operationId: ingest_whatsapp_executives_link
      tags: [Ingest]
      security:
        - IngestAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutiveLinkIn'
      responses:
        '200':
          description: Lead vinculado al ejecutivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ─── Leads (Dashboard JWT) ───────────────────────────────────────────────────

  /api/v1/leads:
    get:
      summary: Listar leads del tenant autenticado
      operationId: leads_list
      tags: [Leads]
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: temperature
          in: query
          schema:
            type: string
            enum: [cold, warm, hot]
        - name: lifecycle_status
          in: query
          schema:
            type: string
        - name: direction
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
      responses:
        '200':
          description: Lista paginada de leads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Plan Free — upgrade requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/leads/{lead_id}:
    get:
      summary: Obtener lead por ID
      operationId: leads_get
      tags: [Leads]
      security:
        - BearerAuth: []
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle del lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadOut'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Actualizar un lead
      operationId: leads_patch
      tags: [Leads]
      security:
        - BearerAuth: []
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadUpdate'
      responses:
        '200':
          description: Lead actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadOut'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Conversations (Dashboard JWT) ──────────────────────────────────────────

  /api/v1/conversations:
    get:
      summary: Listar conversaciones del tenant autenticado
      operationId: conversations_list
      tags: [Conversations]
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [new, active, waiting, closed]
        - name: channel
          in: query
          schema:
            type: string
            enum: [whatsapp, email, web]
        - name: requires_human
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          description: Subcadena literal del nombre, teléfono, sesión o texto del último mensaje.
          schema:
            type: string
            maxLength: 120
        - name: before_at
          in: query
          description: Fecha del cursor devuelto. Usar con before_id y sin offset.
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista paginada de conversaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/conversations/{conversation_id}:
    get:
      summary: Obtener conversación por ID
      operationId: conversations_get
      tags: [Conversations]
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de conversación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{conversation_id}/read:
    post:
      summary: Marcar los mensajes visibles como leídos por el equipo
      description: Requiere crm.manage. El ID debe pertenecer a la conversación.
      operationId: conversations_read
      tags: [Conversations]
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [through_message_id]
              properties:
                through_message_id:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Contador compartido dentro del envelope estándar.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, const: true}
                  data:
                    type: object
                    required: [no_leidos]
                    properties:
                      no_leidos: {type: integer, minimum: 0}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Permiso de gestión de CRM requerido.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{conversation_id}/messages:
    get:
      summary: Listar mensajes de una conversación
      operationId: conversations_messages_list
      tags: [Conversations]
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: order
          in: query
          description: Orden cronológico por fecha del mensaje o desde el último mensaje registrado.
          schema:
            type: string
            enum: [chronological, recent]
            default: chronological
        - name: before_id
          in: query
          description: En modo recent, usa el ID del último resultado para pedir los mensajes anteriores.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista paginada de mensajes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Analytics (Dashboard JWT) ──────────────────────────────────────────────

  /api/v1/analytics/summary:
    get:
      summary: Resumen de métricas del tenant autenticado
      operationId: analytics_summary
      tags: [Analytics]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Métricas agregadas del tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Agents STUB (Dashboard JWT) ─────────────────────────────────────────────

  /api/v1/agents:
    get:
      summary: Listar agentes del tenant (siempre retorna lista vacía)
      operationId: agents_list
      tags: [Agents]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de agentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentOut'

  /api/v1/agents/configure:
    post:
      summary: Configurar agente del tenant (NOT IMPLEMENTED)
      operationId: agents_configure
      tags: [Agents]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigureRequest'
      responses:
        '501':
          description: No implementado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/agents/{agent_id}:
    patch:
      summary: Actualizar agente (NOT IMPLEMENTED — siempre 404)
      operationId: agents_patch
      tags: [Agents]
      security:
        - BearerAuth: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdateRequest'
      responses:
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Operational Data (Dashboard JWT) ──────────────────────────────────────

  /api/v1/operational/clientes:
    get:
      summary: Listar clientes del tenant
      operationId: operational_clientes_list
      tags: [Operational Data]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalPaginatedResponse'

  /api/v1/operational/leads:
    get:
      summary: Listar leads (tabla operacional nativa)
      operationId: operational_leads_list
      tags: [Operational Data]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada de leads (raw)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalPaginatedResponse'

  /api/v1/operational/inventario-vehiculos:
    get:
      summary: Listar inventario de vehículos del tenant
      operationId: operational_inventario_vehiculos_list
      tags: [Operational Data]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: disponible
          in: query
          schema:
            type: boolean
            nullable: true
      responses:
        '200':
          description: Inventario de vehículos paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalPaginatedResponse'

  /api/v1/operational/conversaciones:
    get:
      summary: Listar conversaciones (tabla operacional nativa)
      operationId: operational_conversaciones_list
      tags: [Operational Data]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Conversaciones paginadas (raw)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalPaginatedResponse'

  /api/v1/operational/mensajes-dashboard:
    get:
      summary: Listar mensajes del dashboard
      operationId: operational_mensajes_dashboard_list
      tags: [Operational Data]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: whatsapp_id
          in: query
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: Mensajes del dashboard paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalPaginatedResponse'

  /api/v1/operational/solicitudes-derechos:
    get:
      summary: Listar solicitudes de derechos de datos (privacidad)
      operationId: operational_solicitudes_derechos_list
      tags: [Operational Data]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Solicitudes de privacidad paginadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalPaginatedResponse'

  /api/v1/operational/ejecutivos:
    get:
      summary: Listar ejecutivos del tenant
      operationId: operational_ejecutivos_list
      tags: [Operational Data]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Ejecutivos paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalPaginatedResponse'

  /api/v1/operational/log-limpiezas:
    get:
      summary: Listar log de limpieza/anonimización de datos
      operationId: operational_log_limpiezas_list
      tags: [Operational Data]
      security:
        - BearerAuth: []
      parameters:
