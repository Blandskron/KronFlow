      required: [tenant_id, title, filename, raw_text]
      properties:
        tenant_id:
          type: string
        title:
          type: string
        filename:
          type: string
        content_type:
          type: string
          default: text/plain
        status:
          type: string
          default: active
        priority:
          type: integer
          default: 100
        raw_text:
          type: string
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/ContextChunkCreate'
          default: []

    ContextDocumentRead:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: string
        title:
          type: string
        filename:
          type: string
        content_type:
          type: string
          nullable: true
        status:
          type: string
        priority:
          type: integer
        version:
          type: integer
        source_type:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        error_message:
          type: string
          nullable: true

    BusinessContextStatusRead:
      type: object
      properties:
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        agent_status:
          type: string
          enum: [not_configured, pending, processing, trained, active, error]
        last_updated_at:
          type: string
          nullable: true
        active_documents_count:
          type: integer
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ContextDocumentRead'
        document_actions:
          type: object
          additionalProperties:
            type: boolean

    ContextRetrieveRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        limit:
          type: integer
          default: 3

    ContextSourceRead:
      type: object
      properties:
        document_id:
          type: integer
        chunk_id:
          type: integer
        title:
          type: string
        score:
          type: number
        content:
          type: string

  responses:
    Unauthorized:
      description: No autenticado — token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Acceso prohibido — sin permisos suficientes o plan no válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Rate limit de ingesta excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
