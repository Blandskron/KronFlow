services:
  app:
    build: .
    env_file:
      - path: .env.local
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.base}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env.local}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER must be set in .env.local}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.local}@postgres:5432/${POSTGRES_DB:-flowkron_auth}
      AUTH_DATABASE_SCHEMA: ${AUTH_DATABASE_SCHEMA:-auth_}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8000,http://127.0.0.1:8000}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-flowkron}
      JWT_ISSUER: ${JWT_ISSUER:-flowkron-auth-service}
      JWT_PRIVATE_KEY_PATH: keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: keys/jwt_public.pem
      SIGNING_KEY_ENCRYPTION_KEY: ${SIGNING_KEY_ENCRYPTION_KEY:?SIGNING_KEY_ENCRYPTION_KEY must be set in .env.local}
      SIGNING_KEY_ENCRYPTION_SALT: ${SIGNING_KEY_ENCRYPTION_SALT:-flowkron-auth-service}
      GENERATE_JWT_KEYS: "True"
      RUN_MIGRATIONS: "True"
      RUN_SEEDS: "True"
      RUN_COLLECTSTATIC: "True"
      CREATE_SUPERUSER: ${CREATE_SUPERUSER:-False}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      IAM_PLATFORM_TENANT_SLUG: ${IAM_PLATFORM_TENANT_SLUG:-flowkron-platform}
      IAM_AUTO_VERIFY_USER_EMAIL: "False"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      MAIL_GATEWAY_URL: ${MAIL_GATEWAY_URL:-}
      MAIL_INTERNAL_API_KEY: ${MAIL_INTERNAL_API_KEY:-}
      MAIL_SENDER_KEY: ${MAIL_SENDER_KEY:-flowkron}
      EMAIL_HOST: ${EMAIL_HOST:-mail.example.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-verify@example.com}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-True}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-verify@example.com}
      EMAIL_LOG_TOKEN_ON_FAILURE: ${EMAIL_LOG_TOKEN_ON_FAILURE:-False}
      OPERATIONAL_SERVICE_URL: ${OPERATIONAL_SERVICE_URL:-http://host.docker.internal:8001}
      OPERATIONAL_INTERNAL_TOKEN: ${OPERATIONAL_INTERNAL_TOKEN:-change-me-local-internal-token}
    ports:
      - "8000:8000"
    volumes:
      - auth-media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowkron_auth}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  auth-media:
