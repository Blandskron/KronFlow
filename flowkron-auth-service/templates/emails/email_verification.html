<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verifica tu correo</title>
  </head>
  <body style="margin:0;background:#f5f7fb;color:#111827;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 12px;">
                <div style="font-size:14px;font-weight:700;color:#2563eb;letter-spacing:.04em;text-transform:uppercase;">{{ app_name }}</div>
                <h1 style="margin:12px 0 8px;font-size:26px;line-height:1.2;color:#111827;">Confirma tu correo</h1>
                <p style="margin:0;color:#4b5563;font-size:16px;line-height:1.6;">
                  Para activar tu acceso, confirma que este correo pertenece a tu cuenta.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px 8px;">
                <a href="{{ confirm_url }}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:700;padding:14px 20px;border-radius:8px;">
                  Confirmar correo
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px 28px;">
                <p style="margin:0 0 10px;color:#6b7280;font-size:14px;line-height:1.6;">
                  Si el boton no abre la aplicacion, copia y pega este enlace en tu navegador:
                </p>
                <p style="margin:0;word-break:break-all;color:#2563eb;font-size:14px;line-height:1.6;">
                  <a href="{{ confirm_url }}" style="color:#2563eb;">{{ confirm_url }}</a>
                </p>
                <p style="margin:18px 0 0;color:#6b7280;font-size:13px;line-height:1.6;">
                  Si no esperabas este correo, puedes ignorarlo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
