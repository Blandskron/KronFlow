services:
  flowkron-mail-service:
    build:
      context: ../../flowkron-mail-service
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_SENDERS_JSON: ${EMAIL_SENDERS_JSON:-}
      INTERNAL_CLIENTS_JSON: ${INTERNAL_CLIENTS_JSON:-}
      REDIS_URL: redis://flowkron-redis:6379/1
      ENABLE_LEGACY_MAIL_ENDPOINT: "false"
    depends_on:
      flowkron-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - flowkron-network
