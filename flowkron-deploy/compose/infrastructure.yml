services:
  flowkron-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowkron_auth}
      POSTGRES_USER: ${POSTGRES_USER:-flowkron_admin}
      POSTGRES_PASSWORD_FILE: /run/flowkron/password
    ports:
      - "${FLOWKRON_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - flowkron-postgres-18-cluster:/var/lib/postgresql
      - flowkron-postgres-config:/run/flowkron:ro
    depends_on:
      flowkron-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - flowkron-network

  flowkron-redis:
    image: redis:7
    ports:
      - "${FLOWKRON_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - flowkron-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - flowkron-network

volumes:
  flowkron-postgres-18-cluster:
  flowkron-redis-data:

networks:
  flowkron-network:
    driver: bridge
