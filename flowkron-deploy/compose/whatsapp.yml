services:
  flowkron-baileys-services:
    build:
      context: ../../flowkron-baileys-services
    environment:
      BAILEYS_INTERNAL_TOKEN_FILE: /run/flowkron/internal_token
      BAILEYS_INGEST_TENANT_CODE: ${BAILEYS_INGEST_TENANT_CODE:-}
      BAILEYS_INGEST_KEY: ${BAILEYS_INGEST_KEY:-}
      BAILEYS_SESSIONS_DIR: /app/sessions
      OPERATIONAL_SERVICE_URL: ${OPERATIONAL_SERVICE_URL:-http://flowkron-operational-service:8001}
    volumes:
      - baileys-lab-sessions:/app/sessions
      - flowkron-channel-config:/run/flowkron:ro
    depends_on:
      flowkron-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - flowkron-network

volumes:
  baileys-lab-sessions:
