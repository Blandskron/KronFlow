<section class="context-container">
  <flowkron-page-header
    title="Contexto empresarial"
    subtitle="Administra los conocimientos, documentos y reglas del agente conversacional de IA."
  />

  <div class="tabs-bar">
    <flowkron-tabs
      [tabs]="tabs"
      [activeId]="activeTab()"
      ariaLabel="Secciones de contexto empresarial"
      (selected)="setTab($event)"
    />
  </div>

  @if (errorMsg()) {
    <div class="section-spacer">
      <flowkron-alert tone="danger" title="Error de integración" [dismissible]="true" (dismissed)="errorMsg.set('')">
        {{ errorMsg() }}
      </flowkron-alert>
    </div>
  }

  @switch (activeTab()) {
    @case ('summary') {
      <flowkron-context-summary-panel
        [contextStatus]="contextStatus()"
        [documents]="documents()"
        [loading]="statusLoading()"
        [error]="statusError()"
        (goToUpload)="setTab('upload')"
        (deleteDocument)="deleteDoc($event)"
      />
    }
    @case ('upload') {
      <flowkron-context-upload-panel
        [templates]="templates()"
        [templatesLoading]="templatesLoading()"
        [templatesError]="templatesError()"
        (uploaded)="handleUploaded()"
        (errorOccurred)="errorMsg.set($event)"
      />
    }
    @case ('simulator') {
      <flowkron-agent-simulator-panel
        [hasDraftDocuments]="hasDraftDocuments()"
        (publishDrafts)="publishChanges()"
        (errorOccurred)="errorMsg.set($event)"
      />
    }
  }
</section>
