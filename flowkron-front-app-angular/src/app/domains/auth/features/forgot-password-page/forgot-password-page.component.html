
    <flowkron-auth-layout>
      <form [formGroup]="form" (ngSubmit)="sendCode()">
        <a class="back" routerLink="/login">Volver a login</a>
        <div class="brand"><span class="app-logo"></span><strong>Flowkron</strong></div>
        <h1>Recupera tu contrasena</h1>
        <p class="muted">Ingresa tu correo electronico y te enviaremos las instrucciones para recuperar tu contrasena.</p>

        <label>Correo electronico</label>
        <input class="field" type="email" formControlName="email" placeholder="john@example.com">

        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }

        @if (successMessage()) {
          <p class="notice">{{ successMessage() }}</p>
        }

        <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Enviando...' : 'Enviar instrucciones' }}
        </button>
      </form>
    </flowkron-auth-layout>
