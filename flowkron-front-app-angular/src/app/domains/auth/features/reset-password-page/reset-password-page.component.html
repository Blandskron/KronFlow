
    <flowkron-auth-layout>
      <form [formGroup]="form" (ngSubmit)="reset()">
        <a class="back" routerLink="/login">Volver a login</a>
        <div class="brand"><span class="app-logo"></span><strong>Flowkron</strong></div>
        <h1>Nueva contrasena</h1>
        <p class="muted">Ingresa el codigo recibido y define una nueva contrasena.</p>

        <label>Codigo</label>
        <input class="field code" formControlName="token" inputmode="numeric" maxlength="7" placeholder="Codigo de recuperacion">

        <label>Nueva contrasena</label>
        <input class="field" type="password" formControlName="password" placeholder="************">

        <label>Confirmar contrasena</label>
        <input class="field" type="password" formControlName="confirmPassword" placeholder="************">

        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }

        @if (successMessage()) {
          <p class="notice">{{ successMessage() }}</p>
        }

        <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Actualizando...' : 'Cambiar contrasena' }}
        </button>
      </form>
    </flowkron-auth-layout>
