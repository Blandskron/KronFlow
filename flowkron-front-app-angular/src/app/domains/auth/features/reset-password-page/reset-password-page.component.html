
    <kronflow-auth-layout>
      <form [formGroup]="form" (ngSubmit)="reset()">
        <a class="back" routerLink="/login">Volver a login</a>
        <div class="brand"><span class="app-logo"></span><strong>KronFlow</strong></div>
        <h1>Nueva contraseña</h1>
        <p class="muted">Ingresa el codigo recibido y define una nueva contraseña.</p>

        <label for="reset-code">Código</label>
        <input class="field code" id="reset-code" formControlName="token" autocomplete="one-time-code" inputmode="numeric" maxlength="7" placeholder="Código de recuperación">

        <label for="reset-password">Nueva contraseña</label>
        <input class="field" id="reset-password" type="password" autocomplete="new-password" formControlName="password">

        <label for="reset-confirm">Confirmar contraseña</label>
        <input class="field" id="reset-confirm" type="password" autocomplete="new-password" formControlName="confirmPassword">

        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }

        @if (successMessage()) {
          <p class="notice">{{ successMessage() }}</p>
        }

        <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Actualizando...' : 'Cambiar contraseña' }}
        </button>
      </form>
    </kronflow-auth-layout>
