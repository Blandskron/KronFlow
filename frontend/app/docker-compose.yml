services:
  app:
    env_file:
      - path: .env.local
        required: false
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000/api/v1}
        OPERATIONAL_API_PUBLIC_URL: ${OPERATIONAL_API_PUBLIC_URL:-http://localhost:8001/api/v1}
        AGENT_CORE_API_PUBLIC_URL: ${AGENT_CORE_API_PUBLIC_URL:-http://localhost:8002/api/v1}
        LANDING_PUBLIC_URL: ${LANDING_PUBLIC_URL:-http://localhost:8080}
        SALES_WHATSAPP_NUMBER: ${SALES_WHATSAPP_NUMBER:-}
    container_name: kronflow-app
    ports:
      - "${APP_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  visual-test:
    image: mcr.microsoft.com/playwright:v1.53.0-noble
    profiles:
      - visual
    depends_on:
      app:
        condition: service_healthy
    working_dir: /workspace
    environment:
      BASE_URL: http://app
    volumes:
      - ./tests/visual:/workspace/tests/visual:ro
      - ./visual-test-results:/workspace/visual-test-results
    command: >
      bash -lc "npm init -y >/dev/null
      && npm install --save-dev @playwright/test@1.53.0 >/dev/null
      && npx playwright test tests/visual --reporter=list"
