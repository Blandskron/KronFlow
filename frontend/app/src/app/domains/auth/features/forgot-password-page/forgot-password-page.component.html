
    <kronflow-auth-layout>
      <form [formGroup]="form" (ngSubmit)="sendCode()">
        <a class="back" routerLink="/login">Volver a login</a>
        <div class="brand"><span class="app-logo"></span><strong>KronFlow</strong></div>
        <h1>Recupera tu contraseña</h1>
        <p class="muted">Ingresa tu correo electrónico y te enviaremos las instrucciones para recuperar tu contraseña.</p>

        <label for="recovery-email">Correo electrónico</label>
        <input class="field" id="recovery-email" type="email" autocomplete="email" formControlName="email" placeholder="tu@empresa.example">

        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }

        @if (successMessage()) {
          <p class="notice">{{ successMessage() }}</p>
        }

        <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Enviando...' : 'Enviar instrucciones' }}
        </button>
      </form>
    </kronflow-auth-layout>
