<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="KronFlow — Intelligent CRM · Smart conversations. Seamless automation. Open Source by BLANDSKRON">
  <defs>
    <pattern id="kf-og-grid" width="86" height="86" patternUnits="userSpaceOnUse">
      <path d="M 86 0 L 0 0 0 86" fill="none" stroke="#2DD4BF" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
    <radialGradient id="kf-og-glow1" cx="0.82" cy="0.22" r="0.55">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#060D10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kf-og-glow2" cx="0.14" cy="0.86" r="0.5">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#060D10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kf-og-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#060D10"/>
  <rect width="1200" height="630" fill="url(#kf-og-grid)"/>
  <rect width="1200" height="630" fill="url(#kf-og-glow1)"/>
  <rect width="1200" height="630" fill="url(#kf-og-glow2)"/>

  <!-- Top Open Source pill -->
  <rect x="88" y="86" width="334" height="36" rx="18" fill="#0B161B" stroke="#2DD4BF" stroke-opacity="0.32"/>
  <circle cx="110" cy="104" r="4.5" fill="#10B981"/>
  <text x="126" y="108" fill="#5EEAD4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" letter-spacing="0.1em">OPEN SOURCE · BY BLANDSKRON</text>

  <!-- Brand Lockup -->
  <rect x="88" y="156" width="88" height="88" rx="22" fill="#0A2026" stroke="#2DD4BF" stroke-opacity="0.38" stroke-width="1.5"/>
  <path d="M150 179A26 26 0 0 1 150 221" stroke="#2DD4BF" stroke-opacity="0.3" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 4"/>
  <path d="M114 176V224" stroke="#5EEAD4" stroke-width="6" stroke-linecap="round"/>
  <path d="M148 178C136 183 128 192 119 200C128 208 137 215 150 222" stroke="url(#kf-og-stroke)" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="114" cy="176" r="3.6" fill="#5EEAD4"/>
  <circle cx="119" cy="200" r="5" fill="#07161B" stroke="#5EEAD4" stroke-width="2.6"/>
  <circle cx="148" cy="178" r="4.6" fill="#22D3EE"/>
  <circle cx="150" cy="222" r="4.6" fill="#34D399"/>

  <text x="200" y="210" fill="#EEF7F6" font-family="Sora, Inter, system-ui, sans-serif" font-size="60" font-weight="800" letter-spacing="-0.03em">Kron<tspan fill="#2DD4BF">Flow</tspan></text>
  <text x="202" y="240" fill="#94B4BC" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="600" letter-spacing="0.14em">INTELLIGENT CRM</text>

  <!-- Tagline -->
  <text x="88" y="346" fill="#EEF7F6" font-family="Sora, Inter, system-ui, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em">Smart conversations.</text>
  <text x="88" y="402" fill="#2DD4BF" font-family="Sora, Inter, system-ui, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em">Seamless automation.</text>

  <!-- Feature chips -->
  <rect x="88" y="468" width="184" height="40" rx="12" fill="#0B161B" stroke="#1D3942"/>
  <text x="180" y="493" text-anchor="middle" fill="#EEF7F6" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">WhatsApp + HITL</text>

  <rect x="288" y="468" width="176" height="40" rx="12" fill="#0B161B" stroke="#1D3942"/>
  <text x="376" y="493" text-anchor="middle" fill="#EEF7F6" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">AI Agents + RAG</text>

  <rect x="480" y="468" width="212" height="40" rx="12" fill="#0B161B" stroke="#1D3942"/>
  <text x="586" y="493" text-anchor="middle" fill="#EEF7F6" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Multi-tenant PG18</text>

  <!-- Right Orbital Diagram -->
  <g transform="translate(940, 315)">
    <circle r="170" stroke="#2DD4BF" stroke-opacity="0.14" stroke-dasharray="4 6"/>
    <circle r="118" stroke="#06B6D4" stroke-opacity="0.2"/>
    <circle r="66" fill="#0B1E24" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.5"/>
    <text y="6" text-anchor="middle" fill="#5EEAD4" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" letter-spacing="0.12em">NEXUS</text>
    <circle cx="118" cy="-118" r="8" fill="#22D3EE"/>
    <circle cx="164" cy="40" r="8" fill="#10B981"/>
    <circle cx="-118" cy="118" r="8" fill="#2DD4BF"/>
    <circle cx="-150" cy="-76" r="7" fill="#5EEAD4"/>
  </g>
</svg>
